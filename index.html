<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor Hadith</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f9d76">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--tx:#17201c;--mu:#6a746f;--bd:rgba(0,0,0,.09);--gold:#a8821f;--acc:#0f9d76;--fs:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a100e;--card:#121a17;--tx:#eceee8;--mu:#8b9892;--bd:rgba(255,255,255,.09);--gold:#e3bf5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a100e;--card:#121a17;--tx:#eceee8;--mu:#8b9892;--bd:rgba(255,255,255,.09);--gold:#e3bf5e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html[lang="en"] .logo,html[lang="en"] .h2,html[lang="en"] .tr{font-family:Lora,Georgia,serif}
#wrap{max-width:560px;margin:0 auto;padding:18px 16px}
h2,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:relative}
.logo{font-size:21px;font-weight:600}
.lg{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--bd);background:var(--card);border-radius:99px;font-size:13px;font-weight:500}
.lg svg{width:18px;height:18px;stroke:var(--acc)}
.menu{position:absolute;right:0;top:46px;min-width:160px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:6}
.menu button{display:flex;justify-content:space-between;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.menu button.on{color:var(--acc);font-weight:600}
.hero{position:relative;overflow:hidden;border-radius:26px 26px 26px 6px;padding:26px 22px 20px;color:#fff;background:radial-gradient(circle at 100% 0,rgba(255,255,255,.18) 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(150deg,var(--acc),color-mix(in srgb,var(--acc) 35%,#000))}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border:1px solid rgba(255,255,255,.35);transform:rotate(45deg);box-shadow:0 0 0 14px rgba(255,255,255,.07),0 0 0 28px rgba(255,255,255,.05)}
.hero .k{font-size:13px;opacity:.85}
.hero .ar{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:calc(27px*var(--fs));line-height:2;margin:10px 0 6px;position:relative;z-index:1}
.hero .tr{font-size:calc(15px*var(--fs));opacity:.95;position:relative;z-index:1}
.hero .ref{margin-top:12px;font-size:12.5px;opacity:.8}
.sec{margin:26px 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.books{display:grid;gap:10px}
.bk{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 16px 4px}
.bk i{flex:none;width:44px;height:44px;display:grid;place-items:center;font-style:normal;color:var(--gold);border:1px solid var(--gold);transform:rotate(45deg);border-radius:8px}
.bk i b{transform:rotate(-45deg);font-weight:600;font-size:18px}
.bk span{flex:1}
.bk small{display:block;color:var(--mu);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:6px 18px 18px 18px;padding:16px;margin-bottom:12px}
.tag{font-size:12.5px;color:var(--mu);line-height:1.35}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.no{flex:none;display:grid;place-items:center;min-width:40px;height:40px;padding:0 8px;border:1px solid var(--gold);color:var(--gold);border-radius:12px 12px 12px 3px;font-weight:600;font-size:16px;background:color-mix(in srgb,var(--gold) 10%,transparent)}
.card .ar{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:calc(25px*var(--fs));line-height:2.05;text-align:right;direction:rtl;margin:8px 0}
.card .tr{font-size:calc(15.5px*var(--fs))}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.gr{font-size:12px;padding:2px 10px;border-radius:99px;color:var(--gold);border:1px solid var(--gold)}
.row button{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--mu)}
.row button.on{color:#e0446a}
.back{color:var(--acc);font-weight:500;padding:6px 0;margin-bottom:6px}
.h2{font-size:22px;font-weight:600;margin-bottom:12px}
input[type=search]{width:100%;padding:13px 16px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:14px}
.empty{color:var(--mu);text-align:center;padding:36px 10px}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--bg)}
.sw button.on{border-color:var(--tx)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:6px 0 18px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;color:var(--mu);font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
.note{font-size:13px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.pl{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--mu);font-size:13px}.pl b{color:var(--tx);font-size:15px}
select{width:100%;padding:11px 12px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px}
.btn{width:100%;margin-top:10px;padding:11px;border-radius:12px;background:var(--acc);color:#fff;font-weight:500}
details{margin-top:12px;font-size:14px}.mn{display:grid;gap:8px;margin-top:8px}.mn input{padding:10px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.pt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px}
.pt.sm{opacity:.6;padding:9px 16px;font-size:14px}.pt.nx2{background:linear-gradient(150deg,var(--acc),color-mix(in srgb,var(--acc) 40%,#000));color:#fff;border-color:transparent}.pt b{font-weight:600}.pt small{display:block;opacity:.85;font-size:12px}
.cp{width:min(260px,70vw);display:block;margin:6px auto}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 0;margin-top:6px;font-weight:500}.tg i{flex:none;width:46px;height:27px;border-radius:99px;background:color-mix(in srgb,var(--mu) 45%,transparent);position:relative;transition:.2s}.tg i:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.tg.on i{background:var(--acc)}.tg.on i:after{left:22px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:5}
nav div{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--mu)}
nav button b{font-size:19px;font-weight:400;line-height:1.1}
nav button.on{color:var(--acc);font-weight:600}
nav button.on:after{content:"";width:18px;height:3px;border-radius:3px;background:var(--gold);margin-top:2px}
</style>
</head>

function calc(){const p=place(),z=off(p.tz),n=new Date(Date.now()+z*36e5),jd=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())/864e5+2440587.5-p.lng/360,M=MT[P.pm]||MT[0];
const sp=h=>{const D=jd+h/24-2451545,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*Math.sin(g*rad)+.02*Math.sin(2*g*rad),360),e=23.439-3.6e-7*D,RA=fx(Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))/rad/15,24);return[Math.asin(Math.sin(e*rad)*Math.sin(L*rad))/rad,q/15-RA]};
const nn=12-sp(12)[1],at=(a,h,cc)=>{const dc=sp(h)[0],x=Math.acos(Math.max(-1,Math.min(1,(-Math.sin(a*rad)-Math.sin(dc*rad)*Math.sin(p.lat*rad))/(Math.cos(dc*rad)*Math.cos(p.lat*rad)))))/rad/15;return nn+(cc?-x:x)};
const as=f=>at(-Math.atan(1/(f+Math.tan(Math.abs(p.lat-sp(13)[0])*rad)))/rad,13),mg=at(.833,18),sh=z-p.lng/15;
return{n,arr:[at(M[0],5,1),at(.833,6,1),nn,as(P.ha?2:1),mg,M[1]<0?mg-M[1]/60:at(M[1],18)].map(x=>fx(x+sh,24))}}
function fm(x){let h=Math.floor(x),m=Math.round((x-h)*60);if(m==60){m=0;h++}h%=24;return dg((h%12||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM"))}
function pf(){const s=t(),c=calc(),n=c.n,nh=n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600;let nx=[0,2,3,4,5].find(i=>c.arr[i]>nh),w=0;if(nx==null){nx=0;w=24}const df=c.arr[nx]+w-nh,hh=Math.floor(df),mm=Math.floor((df-hh)*60);return s.names.map((nm,i)=>`<div class="pt${i===1?" sm":""}${i===nx?" nx2":""}"><span><b>${nm}</b>${i===nx?`<small>${dg(s.inn(hh,mm))}</small>`:""}</span><b>${fm(c.arr[i])}</b></div>`).join("")}
